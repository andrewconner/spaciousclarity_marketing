<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Spacious Clarity social card">
  <!-- Print Terrain: paper ground, layered terrain bands, Sun Clay dot -->
  <rect width="1200" height="630" fill="#F6F2EA" />

  <!-- Sun Clay dot in open sky -->
  <circle cx="1016" cy="150" r="40" fill="#C87435" />

  <!-- Layered terrain bands: mist blue, sage, lichen -->
  <path d="M -20 486 C 210 446 470 436 700 468 C 890 494 1090 482 1220 450 L 1220 650 L -20 650 Z" fill="#B7C2C8" />
  <path d="M -20 548 C 190 514 450 508 680 532 C 880 552 1090 548 1220 524 L 1220 650 L -20 650 Z" fill="#99A68D" />
  <path d="M -20 598 C 210 574 470 572 700 586 C 890 598 1090 596 1220 578 L 1220 650 L -20 650 Z" fill="#55624B" />

  <!-- Copy -->
  <text x="88" y="148" fill="#3D4750" font-family="'Host Grotesk', Helvetica, sans-serif" font-size="22" font-weight="600" letter-spacing="5.2">SPACIOUS CLARITY</text>

  <text x="88" y="256" fill="#1A2129" font-family="'Literata', Georgia, serif" font-size="78" font-weight="400">Meditation that welcomes</text>
  <text x="88" y="340" fill="#1A2129" font-family="'Literata', Georgia, serif" font-size="78" font-weight="400" font-style="italic">all of life.</text>

  <text x="88" y="422" fill="#3D4750" font-family="'Host Grotesk', Helvetica, sans-serif" font-size="22">An adaptive practice for steady, vivid presence.</text>

  <!-- small orienting dot on brand line -->
  <circle cx="72" cy="140" r="5" fill="#C87435" />
</svg>
