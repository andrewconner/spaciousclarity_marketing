<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Spacious Clarity social card">
  <!-- Design source: scripts/og-card.html (rendered to og-card.png, which the
       og:image meta actually uses). Keep the three in sync. -->
  <defs>
    <clipPath id="og-mark-paper"><circle cx="32" cy="32" r="31.25" /></clipPath>
    <filter id="og-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA" />

  <!-- Line art: ridge strokes + method rings with the sun-clay summit dot -->
  <g fill="none" stroke="#1A2129" stroke-width="1.4" stroke-linecap="round" opacity="0.42">
    <path d="M 820 366 C 890 346 970 338 1050 344 C 1120 349 1175 362 1212 378" />
    <path d="M 862 404 C 926 388 1000 382 1072 388 C 1132 393 1180 404 1212 416" />
  </g>
  <!-- Terrain bands from the mark, swelling toward the sun -->
  <path d="M -20 566 C 240 552 480 528 720 498 C 900 476 1080 472 1220 486 L 1220 650 L -20 650 Z" fill="#B7C2C8" />
  <path d="M -20 600 C 240 590 500 572 760 552 C 940 539 1100 538 1220 546 L 1220 650 L -20 650 Z" fill="#95A884" />
  <path d="M -20 622 C 260 616 540 604 800 590 C 970 581 1120 582 1220 588 L 1220 650 L -20 650 Z" fill="#55624B" />
  <g transform="translate(1002 170)" fill="none">
    <circle r="148" stroke="#1A2129" stroke-width="1" opacity="0.12" />
    <circle r="100" stroke="#1A2129" stroke-width="1" opacity="0.12" />
    <circle r="54" stroke="#1A2129" stroke-width="1" opacity="0.12" />
    <circle r="15" fill="#C87435" />
  </g>

  <!-- Brand row: mark + serif wordmark -->
  <g transform="translate(88 76)">
    <svg viewBox="0 0 64 64" width="46" height="46" fill="none">
      <circle cx="32" cy="32" r="31.25" fill="#F6F2EA" stroke="#D9D1C4" stroke-width="1.5" />
      <g clip-path="url(#og-mark-paper)">
        <path d="M-2 38 C12 33 26 32 38 35.5 C48 38.5 58 37 66 33.5 L66 66 H-2 Z" fill="#B7C2C8" />
        <path d="M-2 47 C10 42.5 24 42 36 45 C46 47.5 58 46.5 66 43.5 L66 66 H-2 Z" fill="#95A884" />
        <path d="M-2 55 C12 51 26 51 38 53.5 C48 55.5 58 55 66 52 L66 66 H-2 Z" fill="#55624B" />
      </g>
      <circle cx="43" cy="16" r="5.4" fill="#C87435" />
    </svg>
  </g>
  <text x="150" y="108" fill="#1A2129" font-family="'Literata', 'Iowan Old Style', Georgia, serif" font-size="27" font-weight="520" letter-spacing="-0.32">Spacious Clarity</text>

  <!-- Headline: hero title voice -->
  <text x="88" y="294" fill="#1A2129" font-family="'Literata', 'Iowan Old Style', Georgia, serif" font-size="78" font-weight="420" letter-spacing="-0.94">Meditation that welcomes</text>
  <text x="88" y="381" fill="#1A2129" font-family="'Literata', 'Iowan Old Style', Georgia, serif" font-size="78" font-weight="420" font-style="italic" letter-spacing="-0.94">all of life.</text>

  <!-- Caption with hairline rule -->
  <line x1="88" y1="434" x2="668" y2="434" stroke="#D0C8BC" stroke-width="1" />
  <text x="88" y="473" fill="#625C54" font-family="'Host Grotesk', Helvetica, sans-serif" font-size="23" font-weight="500" letter-spacing="0.46">An adaptive practice for steady, vivid presence.</text>

  <!-- Folio — ivory on the lichen band -->
  <text x="1112" y="612" text-anchor="end" fill="#F6F2EA" font-family="'Host Grotesk', Helvetica, sans-serif" font-size="21" font-weight="500" letter-spacing="0.63">spaciousclarity.com</text>

  <!-- Paper grain -->
  <rect width="1200" height="630" filter="url(#og-grain)" opacity="0.07" style="mix-blend-mode: multiply" />
</svg>
