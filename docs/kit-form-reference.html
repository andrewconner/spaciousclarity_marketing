<!-- Kit form reference for Spacious Clarity waitlist.
     The site uses this form action directly in the styled Astro forms. -->
<form action="https://app.kit.com/forms/9384984/subscriptions" method="post">
	<input name="email_address" type="email" required />
	<input name="fields[signup_source]" type="hidden" value="spaciousclarity.com" />
	<input name="fields[signup_box]" type="hidden" value="hero-or-closing" />
	<input name="fields[referrer]" type="hidden" />
	<input name="fields[utm_source]" type="hidden" />
	<input name="fields[utm_medium]" type="hidden" />
	<input name="fields[utm_campaign]" type="hidden" />
	<input name="fields[utm_term]" type="hidden" />
	<input name="fields[utm_content]" type="hidden" />
	<button type="submit">Join the waitlist</button>
</form>
